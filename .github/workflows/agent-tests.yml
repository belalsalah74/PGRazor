name: Agent tests
on:
  push:
    paths: ["agent/**"]
  pull_request:
    paths: ["agent/**"]
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: node --test agent/test/throw-catch-agent.test.cjs
