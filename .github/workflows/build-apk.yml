name: Build installable APK

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-apk:
    runs-on: windows-latest
    timeout-minutes: 30
    env:
      PGRAZOR_BUILD_TOOLS: 36.0.0
      PGRAZOR_ANDROID_PLATFORM: android-36
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.12'
      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '22'
      - uses: android-actions/setup-android@9fc6c4e9069bf8d3d10b2204b1fb8f6ef7065407 # v3
        with:
          packages: platform-tools
          log-accepted-android-sdk-licenses: false
      - name: Install Android SDK
        run: sdkmanager "platforms;android-36" "build-tools;36.0.0" "sources;android-36"
      - name: Install test dependencies
        run: python -c "import sys; sys.path.insert(0, 'pgrazor'); import dex_bridges; dex_bridges.dependencies(download=True)"
      - name: Run source and JVM checks
        run: python -B tools/check.py
      - name: Build standalone PGRazor controls preview
        run: python -B pgrazor/build.py
      - name: Verify APK and generate checksums
        shell: pwsh
        run: |
          $apk = Join-Path (Get-Location) 'pgrazor/build/pgrazor-preview.apk'
          if (!(Test-Path -LiteralPath $apk -PathType Leaf)) { throw 'Standalone preview APK was not created' }
          & (Join-Path $env:ANDROID_HOME 'build-tools/36.0.0/apksigner.bat') verify $apk
          if ($LASTEXITCODE -ne 0) { throw 'APK signature verification failed' }
          New-Item -ItemType Directory -Force -Path dist/apk | Out-Null
          Copy-Item -LiteralPath $apk -Destination 'dist/apk/PGRazor-preview.apk'
          $hash = (Get-FileHash -LiteralPath 'dist/apk/PGRazor-preview.apk' -Algorithm SHA256).Hash.ToLowerInvariant()
          "$hash  PGRazor-preview.apk" | Set-Content -LiteralPath 'dist/apk/SHA256SUMS.txt' -Encoding ascii
          @{
            artifact = 'PGRazor-preview.apk'
            package = 'dev.pgrazor'
            build_type = 'standalone-controls-preview'
            source_commit = $env:GITHUB_SHA
            apk_sha256 = $hash
          } | ConvertTo-Json | Set-Content -LiteralPath 'dist/apk/build-info.json' -Encoding utf8
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: PGRazor-installable-preview
          path: |
            dist/apk/PGRazor-preview.apk
            dist/apk/SHA256SUMS.txt
            dist/apk/build-info.json
          if-no-files-found: error
          retention-days: 14
